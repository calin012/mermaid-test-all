name: Render Mermaid diagrams to PNG

on:
  push:
    branches: [main]
    paths:
      - "diagrams/**/*.mmd"
      - ".github/workflows/render-mermaid.yml"
  workflow_dispatch: {}

# Needed so the workflow can push the rendered PNGs back to the repo
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render all .mmd files in diagrams/
        run: |
          mkdir -p diagrams/rendered
          for f in diagrams/*.mmd; do
            name="$(basename "${f%.mmd}")"
            mmdc -i "$f" \
                 -o "diagrams/rendered/${name}.png" \
                 -p diagrams/puppeteer-config.json \
                 -b transparent \
                 -s 2
          done

      - name: Commit rendered PNGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: re-render mermaid diagrams [skip ci]"
          file_pattern: "diagrams/rendered/*.png"
